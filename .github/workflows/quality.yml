name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Monorepo checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
