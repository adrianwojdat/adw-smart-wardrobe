# Supabase 0.8.4 baseline: see infra/supabase/provenance.json
name: smart-wardrobe
services:
  studio:
    image: supabase/studio:2026.11.02-sha-a05e7ec
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new
          Error(r.status)})"
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      ENABLED_FEATURES_LOGS_ALL: 'false'
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - studio-snippets:/app/snippets
      - ./infra/supabase/volumes/functions:/app/edge-functions:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api-gw:
    image: envoyproxy/envoy:v1.39.6
    restart: unless-stopped
    networks:
      default:
        aliases:
          - envoy
          - kong
      studio-access: {}
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      studio:
        condition: service_healthy
    volumes:
      - ./infra/supabase/volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./infra/supabase/volumes/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./infra/supabase/volumes/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./infra/supabase/volumes/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint:
      - /bin/sh
      - /docker-entrypoint.sh
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - 127.0.0.1:8000:8000
  auth:
    image: smart-wardrobe-auth:gotrue-v2.197.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9999/health
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Potwierdź adres e-mail — Smart Wardrobe
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://127.0.0.1:8089/pl-PL/confirmation.html
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Zresetuj hasło — Smart Wardrobe
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://127.0.0.1:8089/pl-PL/recovery.html
      GOTRUE_MAILER_SUBJECTS_INVITE: Zaproszenie do Smart Wardrobe
      GOTRUE_MAILER_TEMPLATES_INVITE: http://127.0.0.1:8089/pl-PL/invite.html
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Potwierdź zmianę adresu e-mail — Smart Wardrobe
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://127.0.0.1:8089/pl-PL/email_change.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Twój link do logowania — Smart Wardrobe
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://127.0.0.1:8089/pl-PL/magic_link.html
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: Kod potwierdzający — Smart Wardrobe
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: http://127.0.0.1:8089/pl-PL/reauthentication.html
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: ./infra/auth-email
    init: true
    volumes:
      - ./infra/auth-email/templates:/email-templates:ro
    networks:
      - default
      - egress
  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - postgrest
        - --ready
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgrest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.148.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sSfL --head -o /dev/null -H "Authorization: Bearer ${ANON_KEY}"
          http://localhost:4000/api/tenants/realtime-dev/health'
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
      DISABLE_HEALTHCHECK_LOGGING: 'true'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  storage:
    image: supabase/storage-api:v1.89.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://storage:5000/status
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: 10485760
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: 'true'
      IMGPROXY_URL: http://imgproxy:5001
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - ${STORAGE_PATH:-./data/storage}:/var/lib/storage
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  imgproxy:
    image: darthsim/imgproxy:v4.0.21
    restart: unless-stopped
    volumes:
      - ${STORAGE_PATH:-./data/storage}:/var/lib/storage:ro
    healthcheck:
      test:
        - CMD
        - imgproxy
        - health
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: :5001
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: 'true'
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  functions:
    image: supabase/edge-runtime:v1.77.9
    mem_limit: ${FUNCTIONS_MEMORY_LIMIT:-2g}
    restart: unless-stopped
    volumes:
      - ./infra/supabase/volumes/functions:/home/deno/functions:ro
      - deno-cache:/root/.cache/deno
    depends_on:
      api-gw:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEYS: '{"default":"${SUPABASE_PUBLISHABLE_KEY:-}"}'
      SUPABASE_SECRET_KEYS: '{"default":"${SUPABASE_SECRET_KEY:-}"}'
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT}
    command:
      - start
      - --user-worker-request-idle-timeout
      - '150000'
      - --main-service
      - /home/deno/functions/main
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - default
      - egress
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./infra/supabase/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./infra/supabase/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./infra/supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./infra/supabase/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - postgres-data:/var/lib/postgresql/data
      - ./infra/supabase/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ./infra/supabase/volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      - ./infra/supabase/volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
        - -h
        - localhost
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - 127.0.0.1:54322:5432
    networks:
      - default
      - database-access
  supavisor:
    image: supabase/supavisor:2.9.13
    restart: unless-stopped
    volumes:
      - ./infra/supabase/volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z
    healthcheck:
      test:
        - CMD
        - curl
        - -sSfL
        - --head
        - -o
        - /dev/null
        - http://127.0.0.1:4000/api/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: 'true'
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      - /bin/sh
      - -c
      - /app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:8.2.3-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run node scripts/setup.mjs}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
  dev-mail-relay:
    profiles:
      - dev-mail
    build:
      context: ./infra/dev-mail
    restart: unless-stopped
    init: true
    networks:
      - default
      - egress
    environment:
      DEV_MAIL_RELAY: 'true'
      DEV_SMTP_HOST: ${DEV_SMTP_HOST:-host.docker.internal}
      DEV_SMTP_PORT: ${DEV_SMTP_PORT:-1025}
      DEV_SMTP_USER: ${DEV_SMTP_USER:-}
      DEV_SMTP_PASS: ${DEV_SMTP_PASS:-}
    mem_limit: 128m
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
  migrate:
    build: &a1
      context: .
      dockerfile: infra/Dockerfile.node
    restart: no
    init: true
    stop_grace_period: 30s
    command:
      - node
      - --import
      - tsx
      - apps/api/src/app/migrate.ts
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SESSION_DB_PASSWORD: ${SESSION_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
  api:
    build: *a1
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN}
      APP_ADDITIONAL_ORIGINS: ${APP_ADDITIONAL_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SESSION_DATABASE_URL: postgresql://wardrobe_session:${SESSION_DB_PASSWORD}@db:5432/postgres
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      QUEUE_ADMIN_USER_IDS: ${QUEUE_ADMIN_USER_IDS:-}
      SMTP_ENABLED: ${SMTP_HOST:-}
      EMAIL_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      NODE_OPTIONS: --max-old-space-size=384
      GEMINI_ENCRYPTION_KEY: ${GEMINI_ENCRYPTION_KEY:-}
      GEMINI_RPM_LIMIT: ${GEMINI_RPM_LIMIT:-12}
      GEMINI_SHARED_QUOTA_ID: ${GEMINI_SHARED_QUOTA_ID:-}
      GEMINI_TPM_LIMIT: ${GEMINI_TPM_LIMIT:-}
      GEMINI_RPD_LIMIT: ${GEMINI_RPD_LIMIT:-}
      GEMINI_MAX_QUEUE: ${GEMINI_MAX_QUEUE:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api-gw:
        condition: service_healthy
      rest:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    mem_limit: 768m
  worker:
    build: *a1
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command:
      - node
      - --import
      - tsx
      - apps/worker/src/index.ts
    networks:
      - default
      - egress
    environment:
      NODE_ENV: production
      GARMENT_ANALYSIS_PROVIDER: ${GARMENT_ANALYSIS_PROVIDER:-fashion-siglip}
      WORKER_DATABASE_URL: postgresql://wardrobe_worker:${WORKER_DB_PASSWORD}@db:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      NODE_OPTIONS: --max-old-space-size=256
      GEMINI_ENCRYPTION_KEY: ${GEMINI_ENCRYPTION_KEY:-}
      GEMINI_RPM_LIMIT: ${GEMINI_RPM_LIMIT:-12}
      GEMINI_SHARED_QUOTA_ID: ${GEMINI_SHARED_QUOTA_ID:-}
      GEMINI_TPM_LIMIT: ${GEMINI_TPM_LIMIT:-}
      GEMINI_RPD_LIMIT: ${GEMINI_RPD_LIMIT:-}
      GEMINI_TASK_TIMEOUT_MS: ${GEMINI_TASK_TIMEOUT_MS:-900000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api-gw:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    mem_limit: 1536m
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    networks:
      - default
      - egress
    ports:
      - ${HTTP_PORT:-8080}:80
      - ${HTTPS_PORT:-8443}:443
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8081/healthz
volumes:
  db-config: null
  deno-cache: null
  postgres-data: {}
  storage-data: {}
  redis-data: {}
  studio-snippets: {}
  caddy-data: {}
  caddy-config: {}
networks:
  default:
    internal: true
  egress: {}
  database-access: {}
  studio-access: {}
